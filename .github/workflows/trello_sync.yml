name: Trello Bugs to GitHub Issues Sync

on:
  schedule:
    # Roda toda segunda-feira às 09:00 UTC (06:00 de Brasília)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Permite rodar manualmente clicando em um botão no GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: 🛎️ Checkout do código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🔄 Rodar Script de Sincronização
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_trello_github.py
